name: CI Quality Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build Docker, Lint & Test
    runs-on: ubuntu-latest

    steps:
      # ── 1. Récupération du code ──────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Requis par SonarCloud pour l'analyse de blame git

      # ── 2. Build de l'image Docker ───────────────────────────────────────────
      - name: Build Docker image
        run: docker build -t qualimetrie-app .

      # ── 3. Linting ESLint via Docker (complexity check) ──────────────────────
      - name: Run Linter (ESLint — Complexité max = 5)
        run: docker run --rm qualimetrie-app npx eslint src/ app.js
        # ⚠️  Cette étape DOIT échouer en Étape 1 (certScore.js trop complexe)
        # Elle passe en Étape 4 (certScore.refactored.js est propre)

      # ── 4. Tests unitaires + rapport de couverture via Docker ─────────────────
      - name: Run Tests (Jest + Coverage)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/coverage:/app/coverage \
            qualimetrie-app \
            npx jest --coverage --coverageReporters=lcov --coverageReporters=text

      # ── 5. Envoi du rapport à SonarCloud ─────────────────────────────────────
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Le SONAR_TOKEN doit être ajouté dans :
        # GitHub repo → Settings → Secrets and variables → Actions → New repository secret
