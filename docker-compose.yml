services:
  # ── Application principale ────────────────────────────────────────────────
  app:
    build: .
    container_name: qualimetrie-app
    ports:
      - "3000:3000"
    volumes:
      # Hot-reload : sync du code sans rebuild
      - .:/app
      # Isoler node_modules du conteneur (ne pas l'écraser avec le volume)
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: node app.js

  # ── Linter ESLint ─────────────────────────────────────────────────────────
  lint:
    build: .
    container_name: qualimetrie-lint
    volumes:
      - .:/app
      - /app/node_modules
    command: npx eslint src/ app.js
    profiles: ["tools"]

  # ── Tests Jest + couverture ───────────────────────────────────────────────
  test:
    build: .
    container_name: qualimetrie-test
    volumes:
      - .:/app
      - /app/node_modules
      # Exposer le rapport de couverture sur l'hôte
      - ./coverage:/app/coverage
    command: npx jest --coverage
    environment:
      - NODE_ENV=test
    profiles: ["tools"]
